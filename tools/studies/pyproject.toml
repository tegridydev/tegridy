[project]
name = "tegridy-studies"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Markdown==3.10.3",
    "pytest==9.1.1",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "Pillow==12.3.0",
    "pypdf==6.17.0",
    "Flask==3.1.3",
    "torch==2.14.0",
    "transformers==5.16.1",
    "huggingface-hub==1.30.0",
    "pyarrow==25.0.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
