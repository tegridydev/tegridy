name: Validate and publish website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.21'
      - name: Install pinned renderer
        run: uv venv --python 3.12 && uv pip sync --python .venv/bin/python requirements.txt
      - name: Test publication
        run: uv run --no-project --python .venv/bin/python -m unittest discover -s tools/tests -v
      - name: Test viewer without starting a browser
        run: node blog/model-interpretability/what-a-model-map-can-show/test_viewer.cjs
      - name: Test analytics
        run: node tools/tests/test_analytics.cjs
      - name: Validate project Pages compatibility
        run: uv run --no-project --python .venv/bin/python tools/build.py --base-url https://tegridydev.github.io/tegridy
      - name: Build custom-domain production artifact
        run: uv run --no-project --python .venv/bin/python tools/build.py

  publish:
    name: Update static and request Pages build
    needs: build
    if: github.repository == 'tegridydev/tegridy' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    concurrency:
      group: publish-static
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned site dependency
        run: python -m pip install -r requirements.txt
      - name: Build production site
        run: python tools/build.py
      - name: Publish through the existing static branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish.py
