<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/#home" aria-label="tegridydev home">
        <span class="brand-mark" aria-hidden="true">[td]</span>
        <span>tegridydev</span>
      </a>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/#projects">Projects</a>
        <a href="/#datasets">Data</a>
        <a href="/#writing">Writing</a>
        <a href="/blog/">Blog</a>
        <a href="/research/">Research</a>
        <a href="/#research">Citations</a>
        <a class="email-nav" href="/#contact">Contact</a>
      </nav>

      <div class="header-actions">
        <div class="theme-picker">
          <button class="theme-toggle" type="button" aria-expanded="false"
            aria-controls="theme-menu" aria-label="Choose colour theme. Current: System"
            title="Choose colour theme">
            <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="theme-icon-ring" cx="12" cy="12" r="8.5"/>
              <path class="theme-icon-shade" d="M12 3.5a8.5 8.5 0 0 0 0 17Z"/>
              <circle class="theme-icon-core" cx="12" cy="12" r="2.1"/>
            </svg>
          </button>
  
          <div class="theme-menu" id="theme-menu" data-nosnippet hidden>
            <div class="theme-group">
              <p class="theme-group-label" id="catppuccin-themes">catppuccin</p>
              <div class="theme-options" role="group" aria-labelledby="catppuccin-themes">
                <button class="theme-option" type="button" data-theme-choice="system" data-theme-label="System" aria-pressed="true">
                  <span class="theme-swatch" aria-hidden="true"></span>
                  <span>System</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="latte" data-theme-label="Latte" aria-pressed="false">
                  <span class="theme-swatch" data-theme="latte" aria-hidden="true"></span>
                  <span>Latte</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="frappe" data-theme-label="Frappé" aria-pressed="false">
                  <span class="theme-swatch" data-theme="frappe" aria-hidden="true"></span>
                  <span>Frappé</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="macchiato" data-theme-label="Macchiato" aria-pressed="false">
                  <span class="theme-swatch" data-theme="macchiato" aria-hidden="true"></span>
                  <span>Macchiato</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="mocha" data-theme-label="Mocha" aria-pressed="false">
                  <span class="theme-swatch" data-theme="mocha" aria-hidden="true"></span>
                  <span>Mocha</span>
                </button>
              </div>
            </div>
  
            <div class="theme-group">
              <p class="theme-group-label" id="custom-themes">tegridydev</p>
              <div class="theme-options" role="group" aria-labelledby="custom-themes">
                <button class="theme-option" type="button" data-theme-choice="terminal-mint" data-theme-label="Terminal Mint" aria-pressed="false">
                  <span class="theme-swatch" data-theme="terminal-mint" aria-hidden="true"></span>
                  <span>Terminal Mint</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="night-shift" data-theme-label="Night Shift" aria-pressed="false">
                  <span class="theme-swatch" data-theme="night-shift" aria-hidden="true"></span>
                  <span>Night Shift</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="emberline" data-theme-label="Emberline" aria-pressed="false">
                  <span class="theme-swatch" data-theme="emberline" aria-hidden="true"></span>
                  <span>Emberline</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="moss-byte" data-theme-label="Moss Byte" aria-pressed="false">
                  <span class="theme-swatch" data-theme="moss-byte" aria-hidden="true"></span>
                  <span>Moss Byte</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="plum-static" data-theme-label="Plum Static" aria-pressed="false">
                  <span class="theme-swatch" data-theme="plum-static" aria-hidden="true"></span>
                  <span>Plum Static</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="deep-current" data-theme-label="Deep Current" aria-pressed="false">
                  <span class="theme-swatch" data-theme="deep-current" aria-hidden="true"></span>
                  <span>Deep Current</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="graphite" data-theme-label="Graphite" aria-pressed="false">
                  <span class="theme-swatch" data-theme="graphite" aria-hidden="true"></span>
                  <span>Graphite</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="solar-paper" data-theme-label="Solar Paper" aria-pressed="false">
                  <span class="theme-swatch" data-theme="solar-paper" aria-hidden="true"></span>
                  <span>Solar Paper</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="cherry-wire" data-theme-label="Cherry Wire" aria-pressed="false">
                  <span class="theme-swatch" data-theme="cherry-wire" aria-hidden="true"></span>
                  <span>Cherry Wire</span>
                </button>
                <button class="theme-option" type="button" data-theme-choice="cobalt-lab" data-theme-label="Cobalt Lab" aria-pressed="false">
                  <span class="theme-swatch" data-theme="cobalt-lab" aria-hidden="true"></span>
                  <span>Cobalt Lab</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <button class="nav-toggle" type="button" aria-expanded="false"
          aria-controls="mobile-nav-panel" aria-label="Open navigation" title="Navigation">
          <svg class="nav-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="nav-line nav-line-top" d="M4 7h16"/>
            <path class="nav-line nav-line-middle" d="M4 12h16"/>
            <path class="nav-line nav-line-bottom" d="M4 17h16"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="mobile-nav-panel" id="mobile-nav-panel" hidden>
      <div class="container mobile-nav-inner">
        <nav class="mobile-nav" aria-label="Mobile primary navigation">
          <a href="/#projects">Projects</a>
          <a href="/#datasets">Data</a>
          <a href="/#writing">Writing</a>
          <a href="/blog/">Blog</a>
          <a href="/research/">Research</a>
          <a href="/#research">Citations</a>
          <a class="email-nav" href="/#contact">Contact</a>
        </nav>
      </div>
    </div>
  </header>
